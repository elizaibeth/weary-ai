[project]
name = "weary-news-two"
version = "0.1.0"
requires-python = ">=3.11.5"  # soupsieve 4 (CVE fixes) needs 3.11.5+
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pillow>=13.0.0",
    "pypdf>=7.0.1",
    "slack-sdk>=3.46.0",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G", "LOG"]
# Several modules carry long, deliberately single-line prompt/house-style
# strings and test-fixture JSON literals that a formatter can't rewrap
# without breaking their content - line length is advisory here, not enforced.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["agent", "evals"]
ignore_missing_imports = true

[tool.uv]
# Only resolve releases at least three days old (same hold as Dependabot).
exclude-newer = "3 days"
