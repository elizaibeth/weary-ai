# Weekly update PRs. Actions are pinned to commit SHAs, so Dependabot is what
# keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
